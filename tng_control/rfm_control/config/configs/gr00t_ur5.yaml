# GR00T UR5 Configuration
model:
  type: gr00t
  mapper_type: default
  client_type: real
  port: 8043

action:
  type: follow_joint_trajectory
  arm_action_mapper: absolute_joint  # GR00T JointStateMapper → AbsoluteJointStateAction

robots:
  - prefix: ""
    group_name: "arm"
    frame_id: "world"
    joint_state_topic: "/joint_states"
    time_between_goals: 0.5
    arm:
      topic_name: "/arm_controller/follow_joint_trajectory"
      model_input_position_key: "state.joint_positions"
      model_input_velocity_key: ""
      model_input_load_key: ""
      model_output_position_key: "action.joint_positions"
      model_output_velocity_key: ""
    gripper:
      topic_name: "/gripper_controller/gripper_cmd"
      model_input_position_key: "state.finger_positions"
      model_input_velocity_key: ""
      model_input_load_key: ""
      model_output_position_key: "action.finger_positions"
      model_output_velocity_key: ""

images:
  - model_input_key: "video.global_side_cam"
    topic_name: "/camera_global_side/rgb/image_raw/compressed"
    resolution: [640, 480]
    image_type: compressed
    transformation: gr00t

  - model_input_key: "video.global_front_cam"
    topic_name: "/camera_global_front/rgb/image_raw/compressed"
    resolution: [640, 480]
    image_type: compressed
    transformation: gr00t

  - model_input_key: "video.wrist_cam"
    topic_name: "/camera_wrist/rgb/image_raw/compressed"
    resolution: [640, 480]
    image_type: compressed
    transformation: gr00t



