# GR00T SO-101 Dual Arm Mock Test Client Configuration
# For testing dual-arm setup without actual model server
model:
  type: gr00t
  mapper_type: rtc
  client_type: mock  # Uses mock test client
  port: 8043

robots:
  - prefix: "right_arm"
    group_name: "arm"
    frame_id: "world"
    joint_state_topic: "/joint_states"
    time_between_goals: 0.5
    arm:
      topic_name: "/right_arm_controller/follow_joint_trajectory"
      model_input_position_key: "state.single_arm"
      model_input_velocity_key: ""
      model_input_load_key: ""
      model_output_position_key: "action.single_arm"
      model_output_velocity_key: ""
    gripper:
      topic_name: "/right_arm_controller/gripper_cmd"
      model_input_position_key: "state.gripper"
      model_input_velocity_key: ""
      model_input_load_key: ""
      model_output_position_key: "action.gripper"
      model_output_velocity_key: ""

  - prefix: "left_arm"
    group_name: "arm"
    frame_id: "world"
    joint_state_topic: "/joint_states"
    time_between_goals: 0.5
    arm:
      topic_name: "/left_arm_controller/follow_joint_trajectory"
      model_input_position_key: "state.right_gripper_pos"
      model_input_velocity_key: "state.right_gripper_vel"
      model_input_load_key: "state.right_gripper_load"
      model_output_position_key: "action.right_gripper_pos"
      model_output_velocity_key: "action.right_gripper_vel"
    gripper:
      topic_name: "/left_arm_controller/gripper_cmd"
      model_input_position_key: "state.left_gripper_pos"
      model_input_velocity_key: "state.left_gripper_vel"
      model_input_load_key: "state.left_gripper_load"
      model_output_position_key: "action.left_gripper_pos"
      model_output_velocity_key: "action.left_gripper_vel"

# No images for mock client (testing without cameras)
images: []


